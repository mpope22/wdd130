<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <meta name="description" content="Welcome to dry oar rafting, get to know us!">
    <meta name="author" content="Matthew Pope">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Dry Oar">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h2>
                Experience in the great outdoors
            </h2>
            <img src="images/background.jpg">
        </div>
        <form class="subscribe">
            <p>
                Subscribe to our weekly newsletter!
            </p>
            <div class="newsletter">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="newsletter">
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
            </div>
            <button type="submit">Subscribe!</button>
        </form>
        <div class="location">
            <h2>
                SCHEDULE YOUR ADVENTURE NOW!
            </h2>
        </div>
        <div class="format">
            <figure>
                <img src="images/plunge.jpg">
                <figcaption>
                    Never a dull moment on the river!
                </figcaption>
            </figure>
            <figure>
                <img src="images/white-water-rafting.jpg">
                <figcaption>
                    Make sure you come prepared for the Adventure of a lifetime!
                </figcaption>
            </figure>
        </div>

        <div class="booking">
            <a href="contact.html">
                <button>BOOK NOW</button>
            </a>
        </div>
    </main>

    <footer>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook_icon.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin_icon.png" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram_icon.png" alt="Instagram Icon">
            </a>
        </nav>
        <p>
            &copy;2025 Dry Oar Matthew Pope
        </p>
    </footer>
</body>

</html>
